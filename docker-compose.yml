version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: husrt-postgres
    environment:
      POSTGRES_DB: hospital_monitor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: husrt-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
